name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test-build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Docker Image
        run: docker build -t user-api .

      - name: Docker Login
        run: |
          docker login \
          -u ${{ secrets.DOCKER_USERNAME }} \
          -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Docker Image
        run: |
          docker tag user-api \
          ${{ secrets.DOCKER_USERNAME }}/user-api:latest

      - name: Push Docker Image
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/user-api:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user

            docker pull ${{ secrets.DOCKER_USERNAME }}/user-api:latest

            docker stop user-api || true

            docker rm user-api || true

            docker run -d \
              --name user-api \
              -p 80:3000 \
              --env-file .env \
              ${{ secrets.DOCKER_USERNAME }}/user-api:latest
